name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate static project pages and sitemap
        run: python scripts/build_projects.py
      - name: Install social image generator dependency
        run: python -m pip install 'Pillow>=11,<13'
      - name: Ensure social image fonts are available
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - name: Generate social sharing images
        run: python scripts/build_social_images.py
      - name: Validate SEO and internal links
        run: python scripts/validate_seo.py
      - name: Stage published site
        run: |
          mkdir -p _site
          cp CNAME index.html styles.css script.js project-scrollspy.js projects.json favicon.svg robots.txt sitemap.xml dee2976b885148979d86df8b593b649e.txt _site/
          cp -R projects _site/projects
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-indexnow:
    name: Notify IndexNow after deployment
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find last successful submission
        id: base
        shell: bash
        run: |
          marker="refs/tags/indexnow-last-submitted"
          git fetch origin "$marker:$marker" 2>/dev/null || true
          base_sha="0000000000000000000000000000000000000000"
          if git rev-parse --verify --quiet "$marker" >/dev/null; then
            candidate="$(git rev-list -n 1 "$marker")"
            if git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"; then
              base_sha="$candidate"
            fi
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Submit changed published pages
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py
          fi
      - name: Record last successful submission
        run: |
          git tag -f indexnow-last-submitted "$GITHUB_SHA"
          git push --force origin refs/tags/indexnow-last-submitted
