name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate static project pages and sitemap
        run: python scripts/build_projects.py
      - name: Validate SEO and internal links
        run: python scripts/validate_seo.py
      - name: Stage published site
        run: |
          mkdir -p _site
          cp index.html styles.css script.js projects.json favicon.svg robots.txt sitemap.xml pages-sitemap.xml _site/
          cp -R projects _site/projects
          touch _site/.nojekyll
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
